name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm test
      - run: npm run check
      - run: npm run package
      - run: unzip -t dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: timeline-filter-for-x
          path: dist/*.zip
          if-no-files-found: error
