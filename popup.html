<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Timeline Filter for X</title>
    <style>
      body {
        font-family: -apple-system, "Segoe UI", Arial, sans-serif;
        margin: 16px;
        width: 280px;
        color: #263640;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      p {
        font-size: 13px;
        color: #61717a;
        margin: 0 0 16px;
      }
      .row {
        align-items: center;
        display: flex;
        justify-content: space-between;
      }
      .row + .row {
        margin-top: 12px;
      }

      .toggle {
        display: inline-block;
        height: 22px;
        position: relative;
        width: 44px;
      }
      .toggle input {
        height: 1px;
        opacity: 0;
        position: absolute;
        width: 1px;
      }
      .toggle input:focus-visible + .slider {
        outline: 2px solid #263640;
        outline-offset: 2px;
      }
      .slider {
        background-color: #c4c8ca;
        bottom: 0;
        cursor: pointer;
        left: 0;
        position: absolute;
        right: 0;
        top: 0;
        transition: 0.3s;
      }
      .slider:before {
        background-color: white;
        bottom: 3px;
        content: "";
        height: 16px;
        left: 3px;
        position: absolute;
        transition: 0.3s;
        width: 16px;
      }
      input:checked + .slider {
        background-color: #b88955;
      }
      input:checked + .slider:before {
        transform: translateX(22px);
      }
      .slider.round {
        border-radius: 22px;
      }
      .slider.round:before {
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <h1>Timeline Filter for X</h1>
    <p>Xのタイムラインから、指定した条件に合う投稿を非表示にします。</p>
    <div class="row">
      <span>有料青バッジの投稿</span>
      <label class="toggle">
        <input type="checkbox" id="toggleSwitch" aria-label="有料青バッジの投稿を非表示" />
        <span class="slider round"></span>
      </label>
    </div>
    <div class="row">
      <span>AI生成ラベル付き投稿</span>
      <label class="toggle">
        <input type="checkbox" id="hideAiGenerated" aria-label="AI生成ラベル付き投稿を非表示" />
        <span class="slider round"></span>
      </label>
    </div>
    <div class="row">
      <span>日本語以外の投稿</span>
      <label class="toggle">
        <input type="checkbox" id="hideForeignLanguage" aria-label="日本語以外の投稿を非表示" />
        <span class="slider round"></span>
      </label>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
